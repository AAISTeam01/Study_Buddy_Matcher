
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter OTP - Study Buddy Matcher</title>
    <link rel="stylesheet" href="OTPPage.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <span>🎓</span>
            <h2>Study Buddy Matcher</h2>
        </div>

        <p>Learn Together • Grow Together</p>
    </header>

    <!-- Main Section -->
    <main>

        <div class="otp-container">

            <div class="otp-icon">📩</div>

            <h1>Enter OTP</h1>

            <p class="description">
                <strong>We've sent a 6-digit OTP to your email address.</strong>
                <br>
                Please enter the OTP to verify your account.
            </p>

            <!-- OTP Form -->
            <form action="OTPValidationServlet" method="post">

                <div class="otp-inputs">
                    <input type="text" name="otp1" maxlength="1"
                           inputmode="numeric" required autofocus>

                    <input type="text" name="otp2" maxlength="1"
                           inputmode="numeric" required>

                    <input type="text" name="otp3" maxlength="1"
                           inputmode="numeric" required>

                    <input type="text" name="otp4" maxlength="1"
                           inputmode="numeric" required>

                    <input type="text" name="otp5" maxlength="1"
                           inputmode="numeric" required>

                    <input type="text" name="otp6" maxlength="1"
                           inputmode="numeric" required>
                </div>

                <!-- Timer -->
                <div class="timer">
                    <span>◷</span>
                    OTP will expire in:
                    <strong>02:00</strong>
                </div>

                <!-- Verify Button -->
                <button type="submit" class="verify-btn">
                    ✓ &nbsp; Verify OTP
                </button>

                <!-- Divider -->
                <div class="divider">
                    <span></span>
                    OR
                    <span></span>
                </div>

                <!-- Resend OTP -->
                <button type="button" class="resend-btn">
                    ↻ &nbsp; Resend OTP
                </button>

                <!-- Back Link -->
                <a href="RegistrationPage.html" class="back-link">
                    ← &nbsp; Back to Registration
                </a>

            </form>

        </div>

    </main>
    
<script>
    const otpInputs = document.querySelectorAll(".otp-inputs input");

    otpInputs.forEach((input, index) => {

        // Automatically move to the next box
        input.addEventListener("input", () => {

            input.value = input.value.replace(/[^0-9]/g, "");

            if (input.value !== "" && index < otpInputs.length - 1) {
                otpInputs[index + 1].focus();
            }

        });

        // Move to the previous box using Backspace
        input.addEventListener("keydown", (event) => {

            if (event.key === "Backspace" &&
                input.value === "" &&
                index > 0) {

                otpInputs[index - 1].focus();
            }

        });

    });
</script>
</body>
</html>
