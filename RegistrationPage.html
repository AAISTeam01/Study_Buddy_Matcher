<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Study Buddy Matcher</title>
    <link rel="stylesheet" href="RegistrationPage.css">
</head>
<body>

    <header class="top-header">
        <div class="brand">
            <span class="cap">🎓</span>
            <span>Study Buddy Matcher</span>
        </div>
        <div class="tagline">Learn Together • Grow Together</div>
    </header>

    <main class="registration-card">

        <div class="hero-icon">👥</div>

        <h1>Welcome to Study Buddy</h1>
        <h3>Create Your Account to Get Started!</h3>

        <div class="divider"></div>

        <form action="ProfilePage.html" method="get">

            <label for="name">Name :</label>
            <div class="input-box">
                <span>👤</span>
                <input type="text" id="name" name="name"
                       placeholder="Enter Name" required>
            </div>

            <label for="email">Email :</label>
            <div class="input-box">
                <span>✉</span>
                <input type="email" id="email" name="email"
                       placeholder="Enter Email" required>
            </div>

            <label for="course">Course :</label>
            <div class="input-box">
                <span>🎓</span>
                <input type="text" id="course" name="course"
                       placeholder="Enter Course" required>
            </div>

            <label for="branch">Branch :</label>
            <div class="input-box">
                <span>🏛</span>
                <select id="branch" name="branch" required>
                    <option value="">Choose Branch</option>
                    <option value="CSE">Computer Science Engineering</option>
                    <option value="IT">Information Technology</option>
                    <option value="ECE">Electronics and Communication</option>
                    <option value="ME">Mechanical Engineering</option>
                    <option value="CE">Civil Engineering</option>
                    <option value="EE">Electrical Engineering</option>
                    <option value="AI-ML">AI &amp; Machine Learning</option>
                    <option value="DS">Data Science</option>
                </select>
            </div>

            <label for="semester">Semester :</label>
            <div class="input-box">
                <span>📅</span>
                <select id="semester" name="semester" required>
                    <option value="">Choose Semester</option>
                    <option value="1">1st Semester</option>
                    <option value="2">2nd Semester</option>
                    <option value="3">3rd Semester</option>
                    <option value="4">4th Semester</option>
                    <option value="5">5th Semester</option>
                    <option value="6">6th Semester</option>
                    <option value="7">7th Semester</option>
                    <option value="8">8th Semester</option>
                </select>
            </div>

            <label for="password">Enter Password :</label>
            <div class="input-box">
                <span>🔒</span>
                <input type="password" id="password" name="password"
                       placeholder="Enter Password" required>
            </div>

            <label for="confirmPassword">Confirm Password :</label>
            <div class="input-box">
                <span>🔒</span>
                <input type="password" id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Re-enter Password" required>
            </div>

            <button type="submit">👤+ &nbsp; Create Account</button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="LoginPage.html">Login Here</a>
        </p>

    </main>

</body>
</html>
