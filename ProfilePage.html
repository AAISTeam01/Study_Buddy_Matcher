<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Profile - Study Buddy Matcher</title>
    <link rel="stylesheet" href="ProfileStyle.css">
</head>
<body>

    <header class="top-header">
        <div class="brand">
            <span class="cap">&#127891;</span>
            <span>Study Buddy Matcher</span>
        </div>
        <div class="tagline">Learn Together &bull; Grow Together</div>
    </header>

    <main class="profile-card">

        <div class="profile-icon">&#128101;</div>
        <h1>Create Your Profile</h1>
        <h3>Find the right Buddy for You!</h3>

        <div class="divider"></div>

        <form action="LoginPage.html" method="post">

            <label>Select Subjects :</label>
            <div class="checkbox-list subjects-list">
                <label><input type="checkbox" name="subjects" value="java"> Java</label>
                <label><input type="checkbox" name="subjects" value="python"> Python</label>
                <label><input type="checkbox" name="subjects" value="dbms"> DBMS</label>
                <label><input type="checkbox" name="subjects" value="daa"> DAA</label>
                <label><input type="checkbox" name="subjects" value="webTechnology"> Web Technology</label>
                <label><input type="checkbox" name="subjects" value="C"> C-Programming</label>
                <label><input type="checkbox" name="subjects" value="C++"> C++</label>
                <label><input type="checkbox" name="subjects" value="coa"> COA</label>
                <label><input type="checkbox" name="subjects" value="os"> OS</label>
                <label><input type="checkbox" name="subjects" value="tafl"> TAFL</label>
            </div>

            <label>Study Interest :</label>
            <div class="checkbox-list interest-list">
                <label><input type="checkbox" name="interest" value="coding"> Coding</label>
                <label><input type="checkbox" name="interest" value="competitiveProgramming"> Competitive Programming</label>
                <label><input type="checkbox" name="interest" value="projectDevelopment"> Project Development</label>
                <label><input type="checkbox" name="interest" value="webDevelopment"> Web Development</label>
            </div>

            <label for="studyMode">Study Mode :</label>
            <select id="studyMode" name="studyMode" required>
                <option value="">Select study mode</option>
                <option value="online">Online</option>
                <option value="offline">Offline</option>
                <option value="both">Both</option>
            </select>

            <label>Study Time :</label>
            <div class="checkbox-list time-list">
                <label><input type="checkbox" name="studyTime" value="earlyMorning"> Early Morning</label>
                <label><input type="checkbox" name="studyTime" value="morning"> Morning</label>
                <label><input type="checkbox" name="studyTime" value="afternoon"> Afternoon</label>
                <label><input type="checkbox" name="studyTime" value="evening"> Evening</label>
                <label><input type="checkbox" name="studyTime" value="night"> Night</label>
            </div>

            <button type="submit">&#128190; &nbsp; Save Profile</button>

        </form>
    </main>

</body>
</html>
